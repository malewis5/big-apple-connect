# Dependabot opens pull requests when a dependency has a newer version.
# Security fixes come as soon as they exist, whatever the schedule here
# (turned on in the repository's settings).
#
# Titles follow Conventional Commits, like the rest of the history. A change
# to the measuring program's dependencies is a `fix`, so release-please
# ships it in a new version; the rest is `chore` and releases nothing.
version: 2

updates:
  # The website and the workspace tools (one pnpm lockfile at the root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a version is published before proposing it, so a
    # bad or hijacked release has time to be caught.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # One pull request a week with every update in it, not one per package.
    groups:
      all:
        patterns: ["*"]
    ignore:
      # Next.js's lint rules can't run on these yet: typescript-eslint stops
      # at TypeScript 6, and three of its plugins stop at ESLint 9. Remove
      # each entry when eslint-config-next supports the newer version.
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: eslint
        versions: [">=10"]

  # The measuring program.
  - package-ecosystem: gomod
    directory: /apps/box
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      all:
        patterns: ["*"]

  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
