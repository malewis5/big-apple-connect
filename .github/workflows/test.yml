name: test

# Pull requests are tested as they change; main is tested after each merge.
# Pushes to other branches don't run anything on their own, so a branch with
# a pull request isn't tested twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the older run. Runs on main
# are never cancelled, so every merge is tested to the end.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # exchanged for a short-lived Vercel Remote Cache token

# The Remote Cache step signs in to Vercel with GitHub's OIDC token, so no
# secret is stored. Until the team's OIDC policy exists it fails without
# stopping the job, and Turborepo falls back to running every task.

jobs:
  # Works out which apps the change touches, so a website change doesn't
  # test the collector on three systems, and the other way around.
  # Turborepo counts some shared files: turbo.json affects both apps, and a
  # lockfile change affects only the apps whose dependencies moved. It
  # doesn't count every root file (a packageManager bump or a
  # pnpm-workspace.yaml change looks like no change at all), so changes to
  # those, or to this workflow, run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      box: ${{ steps.affected.outputs.box }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the comparison needs the history back to the base
          filter: blob:none
      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          turbo="npx --yes turbo@$(jq -r '.devDependencies.turbo' package.json | tr -d '^~')"
          # A pull request is tested as merged into main, and that merge's
          # first parent is the main it was merged with. The event's own base
          # SHA can be older (after a reopen, say), so don't use it.
          if [ "$EVENT" = pull_request ]; then
            BASE=$(git rev-parse HEAD^1)
          else
            BASE=$BEFORE
          fi
          echo "Comparing $BASE..$(git rev-parse HEAD)"
          all=false
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "No base to compare with; testing everything"
            all=true
          elif ! git diff --quiet "$BASE" HEAD -- .github/workflows/test.yml package.json pnpm-workspace.yaml; then
            echo "This workflow or the workspace setup changed; testing everything"
            all=true
          fi
          for app in box web; do
            if [ "$all" = true ]; then
              result=true
            else
              set +e
              $turbo query affected --packages "$app" --base "$BASE" --head HEAD --exit-code > /dev/null
              code=$?
              set -e
              case $code in
                0) result=false ;;
                1) result=true ;;
                *) echo "::warning::turbo query affected failed for $app; testing it anyway"; result=true ;;
              esac
            fi
            echo "$app affected: $result"
            echo "$app=$result" >> "$GITHUB_OUTPUT"
          done

  # The collector, on every system it is released for.
  box:
    needs: changes
    if: needs.changes.outputs.box == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/box/go.mod
          cache-dependency-path: apps/box/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint test --filter=box

  # The website.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint build --filter=web

  # One result for the whole workflow. The branch rules for main require this
  # check and nothing else, because the jobs above are skipped when a change
  # doesn't touch their app, and the box job's name changes with its matrix.
  ci:
    needs: [changes, box, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
