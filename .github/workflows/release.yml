name: release

# On every push to main, release-please opens or updates a release pull
# request holding the next version and its changelog. Merging that pull
# request tags the version and publishes a GitHub Release; the build job
# then attaches the program for each system, with checksums, and records a
# build attestation for each file.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['apps/box--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/box--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach files to the release
      id-token: write # sign the attestation as this workflow
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        working-directory: apps/box
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/box/go.mod
          cache-dependency-path: apps/box/go.sum
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Build for each system
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          for target in linux/arm64 linux/amd64 windows/amd64 darwin/arm64 darwin/amd64; do
            os=${target%/*} arch=${target#*/}
            name=big-apple-connect-box_${os}_${arch}
            [ "$os" = windows ] && name=$name.exe
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-X github.com/malewis5/big-apple-connect-box/apps/box/internal/collector.version=$VERSION" \
              -o "dist/$name" ./cmd/big-apple-connect-box
          done
          cd dist && sha256sum * > checksums.txt
      # An attestation is a signed record that a file was built by this
      # workflow from this commit. GitHub offers them on public repositories.
      - name: Attest the build
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-checksums: apps/box/dist/checksums.txt
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*
