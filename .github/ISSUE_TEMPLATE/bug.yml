name: Something isn't working
description: The measuring program or the website did something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The measuring program
        - The website
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and version
      description: For example "macOS 27 on Apple silicon, v0.0.2", or the browser and device for the website.
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        Anything the program printed. Take out your public address and
        equipment serial numbers first. Don't attach the database file: it
        holds both.
      render: text
